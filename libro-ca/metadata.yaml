description: >
  L'escola no ha estat substituïda per les plataformes: s'ha convertit en un
  dels llocs on les plataformes aprenen a formar persones. Un assaig sobre el
  que la nota, l'algorisme, el rànquing, la notificació i la intel·ligència
  artificial fan amb la nostra manera d'aprendre, de ser lliures, de fracassar
  i de conèixer-nos.
