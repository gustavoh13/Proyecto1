<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hablemos: cartas conversacionales</title>
<meta name="description" content="Juego de cartas conversacionales de PlatFAMs para hablar en familia sobre la vida digital.">
<meta name="theme-color" content="#16205C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hablemos">
<style>
/* Tipografías alojadas con la app: no se pide nada a servidores de terceros. */
@font-face{font-family:"Baloo 2";font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
/* Idea de layout: un solo teléfono al centro de la mesa. Columna única, bloques grandes
   de color pleno, una acción principal por pantalla anclada abajo. Mundo visual único (sin tema claro).
   Cada área del mazo tiene su color y tiñe la partida mediante --area. */
:root{
  color-scheme: dark;
  --noche:#16205C;      /* fondo, el azul de la caja del mazo, más profundo */
  --noche-2:#22308A;    /* paneles */
  --papel:#FFFFFF;      /* carta */
  --tinta:#141A3C;      /* texto sobre carta y sobre colores */
  --naranja:#FF7A1A;
  --turquesa:#12B8A6;
  --amarillo:#FFC928;
  --rosado:#F0478C;
  --area:#EF7A23;--area-tinta:#141A3C;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --texto:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--noche);color:#fff;font-family:var(--texto);font-size:1.125rem;line-height:1.45;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,122,26,.28) 0 90px,transparent 91px),
  radial-gradient(circle at 95% 30%,rgba(18,184,166,.22) 0 130px,transparent 131px),
  radial-gradient(circle at 5% 92%,rgba(240,71,140,.2) 0 110px,transparent 111px);
  background-attachment:fixed}
#app{max-width:480px;min-height:100%;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,.d{font-family:var(--display);font-weight:800;line-height:1.05;text-wrap:balance}
h1{font-size:3.4rem;letter-spacing:-.01em}
h2{font-size:1.9rem}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--amarillo);outline-offset:3px}
.barra{display:flex;align-items:center;gap:10px}
.puntos{background:#fff;color:var(--tinta);font-family:var(--display);font-weight:800;white-space:nowrap;
  padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;font-size:1.15rem}
.puntos.salta{animation:salta .5s}
.pasos{display:flex;gap:6px}
.pasos i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}
.pasos i.ok{background:var(--area)}
.pasos i.ya{background:#fff}
.etq{display:inline-block;font-family:var(--display);font-weight:800;font-size:.95rem;text-transform:uppercase;
  letter-spacing:.06em;padding:3px 12px;border-radius:8px;background:var(--area);color:var(--area-tinta)}
.cuerpo{flex:1;display:flex;flex-direction:column;gap:16px}
.pie{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{display:block;width:100%;font-family:var(--display);font-weight:800;font-size:1.45rem;padding:14px 18px;
  border-radius:16px;background:var(--amarillo);color:var(--tinta);box-shadow:0 6px 0 rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);font-size:1.15rem;padding:11px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area{position:relative;min-height:104px;border-radius:18px;padding:12px 14px;text-align:left;color:var(--tinta);
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s}
.area:active{transform:translateY(4px)}
.area .j{font-family:var(--display);font-weight:600;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.area .n{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.02}
.area .c{font-size:.9rem}
.area .hecho{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--tinta);
  display:grid;place-items:center;font-size:.95rem}
.carta{background:var(--papel);color:var(--tinta);border-radius:22px;padding:22px 20px;box-shadow:0 10px 0 rgba(0,0,0,.3);
  border:12px solid var(--area);overflow:hidden;display:flex;flex-direction:column;gap:14px;animation:entra .45s cubic-bezier(.2,1.3,.4,1)}
.carta p.sit{font-size:1.22rem;line-height:1.36}
.carta img.ilu{display:block;width:calc(100% + 40px);max-width:none;margin:0 -20px}
.carta.conq img.ilu{width:70%;margin:0 auto -22px}
.fam{display:block;width:100%;border-radius:18px;background:#fff}
.preg.larga{font-size:1.25rem}
.carta .num{font-family:var(--display);font-weight:600;font-size:.95rem;opacity:.6}
.gente{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.pers{display:flex;align-items:center;gap:8px;background:#EEF0F8;border-radius:999px;padding:4px 12px 4px 4px;font-size:.95rem}
.pers b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.1rem}
.panel{background:var(--noche-2);border-radius:18px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:600;font-size:1.1rem;min-height:44px;display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;background:#fff;color:var(--tinta)}
.chip.mas{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.chip .x{margin-left:8px;opacity:.6}
.fila{display:flex;gap:8px}
input[type=text],textarea{flex:1;min-width:0;width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:0;background:#fff;color:var(--tinta)}
textarea{min-height:110px;resize:vertical}
.fila .btn{width:auto;font-size:1.15rem;padding:10px 18px}
.opc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op{min-height:128px;border-radius:18px;padding:14px;text-align:left;font-family:var(--display);font-weight:800;font-size:1.2rem;
  line-height:1.15;color:var(--tinta);display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s}
.op:active{transform:translateY(4px)}
.op svg{width:34px;height:34px}
.c0{background:var(--naranja)}.c1{background:var(--turquesa)}.c2{background:var(--amarillo)}.c3{background:var(--rosado)}
.res{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0}
.r{border-radius:14px;padding:10px 14px;color:var(--tinta);display:flex;flex-direction:column;gap:6px;transform-origin:left;animation:crece .6s both}
.r .t{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1.15;display:flex;align-items:center;gap:8px}
.r .fm svg{width:20px;height:20px;display:block}
.r .q{display:flex;flex-wrap:wrap;gap:6px}
.r .q span{background:rgba(255,255,255,.85);border-radius:999px;padding:1px 10px;font-size:.9rem}
.r.cero{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.r.cero .fm svg path{fill:#fff}
.r.cero .q span{background:transparent;padding:0}
.premio{font-family:var(--display);font-weight:800;font-size:1.25rem;background:#fff;color:var(--tinta);border-radius:14px;padding:10px 14px}
.premio small{display:block;font-family:var(--texto);font-weight:400;font-size:.95rem}
.turno{display:block;font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05;color:var(--amarillo);min-height:1em;overflow-wrap:anywhere}
.preg{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.14;text-wrap:balance}
.reloj{height:12px;border-radius:6px;background:rgba(20,26,60,.15);overflow:hidden}
.reloj i{display:block;height:100%;background:var(--area);transform-origin:left;animation:baja 90s linear forwards}
.lista{display:flex;flex-direction:column;gap:8px;padding:0;list-style:none}
.lista li{background:#fff;color:var(--tinta);border-radius:12px;padding:10px 14px;border-left:8px solid var(--turquesa)}
.resumen{font-family:var(--texto);font-size:.95rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;color:var(--tinta);border-radius:12px;padding:12px;margin:10px 0;user-select:text;-webkit-user-select:text}
.grande{font-family:var(--display);font-weight:800;font-size:4.6rem;line-height:1;color:var(--amarillo);font-variant-numeric:tabular-nums}
.nota{font-size:.95rem;color:#D9DCEC}
.dialogo .nota,.carta .nota{color:#3A4066}
.centro{text-align:center}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.top .puntos{margin-left:auto}
.mini{font-family:var(--display);font-weight:800;font-size:.95rem;min-height:44px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff}
.mini.osc{background:var(--tinta);color:#fff}
.mini[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--amarillo)}
.paso{font-size:1rem}
.fila-etq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub{font-size:1.25rem}
h3{font-family:var(--display);font-weight:800;font-size:1.15rem}
.simple{padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.guia{padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.guia li::marker{font-family:var(--display);font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.velo{position:fixed;inset:0;z-index:5;background:rgba(10,14,40,.82);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.dialogo{background:#fff;color:var(--tinta);border-radius:20px;padding:20px;width:100%;max-width:440px;margin:auto 0;display:flex;flex-direction:column;gap:12px}
.dialogo .btn.sec{color:var(--tinta);box-shadow:inset 0 0 0 3px var(--tinta)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;padding:8px 10px;border-radius:12px;background:#E6E9F5;color:var(--tinta);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--tinta);color:#fff}
h1:focus,h2:focus{outline:none}
label{display:block}
canvas#fiesta{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes entra{from{transform:translateY(30px) rotate(-3deg) scale(.92);opacity:.2}to{transform:none;opacity:1}}
@keyframes crece{from{transform:scaleX(.1)}to{transform:none}}
@keyframes baja{to{transform:scaleX(0)}}
@keyframes salta{40%{transform:scale(1.35) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){h1{font-size:2.7rem}.op{font-size:1.05rem;min-height:116px}.preg{font-size:1.4rem}.area .n{font-size:1.2rem}}
</style>
</head>
<body>
<canvas id="fiesta" aria-hidden="true"></canvas>
<main id="app"></main>
<div id="capa"></div>
<div id="voz" class="sr" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- Contenido: las seis áreas del mazo en castellano ----------
   Situaciones, preguntas e ilustraciones: texto literal e imágenes del mazo "Tarjetas familiares
   conversacionales de PlatFAMs: Hablemos" (CC BY-NC-SA 4.0; diseño de Sarc Estudio Creativo).
   Los títulos y las votaciones ("titulo", "vota", "ops") son un añadido de esta app. */
const FAMILIA={Carmen:["16 años","#F0478C"],Teresa:["mamá de Carmen y Juan","#12B8A6"],Luis:["papá de Carmen y Juan","#22308A"],
  Juan:["8 años","#FF7A1A"],Felipe:["11 años","#7A4DE0"],Olga:["abuela","#C2410C"],Antonio:["abuelo","#3F6212"],Ana:["mamá de Felipe","#0E7C86"]};
const AREAS=[
{id:"com",juego:"Juego 01",nombre:"Comunicación",color:"#024EA2",tinta:"#FFFFFF",cartas:[
 {n:"6 y 7",img:"img/q06.png",titulo:"Tres móviles en el sofá",quien:["Carmen","Teresa","Luis"],
  sit:"Carmen, su madre Teresa y su padre Luis están sentados en el sofá del salón, cada uno pendiente de su móvil.\nUna amiga de Carmen acaba de descubrir que algunas de sus compañeras tienen un grupo de chat en una aplicación de mensajería instantánea (como WhatsApp) sin ella, y Carmen intenta consolarla por mensaje. Teresa está frustrada porque la han añadido a otro grupo de chat para organizar una fiesta de cumpleaños. Como no puede asistir, se pregunta si puede salir del grupo de inmediato. Luis ha recibido información sobre una próxima celebración escolar y duda con quién compartirla: solo con la familia más cercana o también con los abuelos.",
  vota:"Te suman a un grupo de chat que no te interesa. ¿Qué haces?",
  ops:["Me salgo de inmediato","Lo silencio y me quedo","Aviso y después me salgo","Me quedo por compromiso"],
  pregs:["¿Cuál es el propósito de tener grupos de conversación diferentes?", "Si te añaden a muchos chats diferentes, ¿te molesta o prefieres que te incluyan?", "¿Qué piensas de que cada uno use su móvil cuando estamos juntos? ¿Nos acerca o nos distrae?"]},
 {n:"8 y 9",img:"img/s08.png",imgq:"img/q08.png",titulo:"La videollamada de cada semana",quien:["Ana","Felipe","Antonio"],
  sit:"Ana ha pensado que podrían hacer una videollamada semanal de media hora con toda la familia. Para ello, sugiere utilizar una nueva aplicación con funciones divertidas, como fondos animados, porque cree que podría resultar más entretenida para su hijo, Felipe, que se aburre fácilmente en las llamadas largas. El abuelo Antonio pasa mucho rato intentando averiguar cómo funciona la aplicación, pero no lo consigue y se siente incómodo. No quiere pedir ayuda al resto de la familia, porque teme que no tendrán tiempo ni paciencia para explicárselo.",
  vota:"Si fueras Antonio, ¿qué harías?",
  ops:["Pido ayuda aunque me cueste","Sigo intentando solo","Propongo llamar por teléfono","Me salto la videollamada"],
  pregs:["¿Qué te parece la idea de hacer videollamadas regulares con toda la familia?", "¿Te gusta experimentar con nuevas aplicaciones?", "¿Te cuesta pedir ayuda a otras personas cuando tienes problemas con alguna nueva aplicación o dispositivo digital? ¿Por qué?", "En una situación como esta, ¿cómo crees que se puede llegar a una solución para toda la familia?"]},
 {n:"10 y 11",img:"img/s10.png",titulo:"El baile de la abuela Olga",quien:["Olga","Luis","Teresa"],
  sit:"La abuela Olga está bailando de forma divertida en la cocina. El resto de la familia, que está de visita, ríe con ella, y algunas personas graban el momento con el móvil. Más tarde, Luis comparte en sus redes sociales el vídeo que ha grabado para mostrar cuánto quiere a su familia. Cuando Teresa ve la publicación, se pregunta cómo se sentiría Olga si pudiera ver el vídeo publicado en redes sociales.",
  vota:"Antes de subir el video, Luis debería…",
  ops:["Pedirle permiso a Olga","Mandarlo solo al chat familiar","Subirlo: es un lindo recuerdo","No subirlo"],
  pregs:["¿Cómo compartes momentos importantes o especiales de tu vida con otras personas?", "¿Compartes cosas divertidas sobre tu familia en las redes sociales? ¿Cómo crees que esto puede hacer sentir a los demás miembros de la familia?", "¿Crees que es importante pensar en qué plataforma utilizar para compartir imágenes personales? ¿Por qué?", "¿Cómo te sentirías si vieras un vídeo como este, pero de otra familia que no conoces?"]},
 {n:"12 y 13",img:"img/q12.png",titulo:"Carmen ganó la liga",quien:["Carmen"],
  sit:"El equipo de baloncesto de Carmen ha ganado la liga. Está muy contenta y, aunque sabe que todo el mundo está trabajando u ocupado, quiere contárselo enseguida a la familia, así que le envía un mensaje a su padre para decirle que tiene grandes noticias.\nCarmen ve que su padre ha leído el mensaje enseguida y, a los pocos minutos, le responde con un icono de pulgar hacia arriba. También envía un mensaje a su tía, que, aunque ve que está conectada, no le responde al momento, y les escribe también a los abuelos. Su abuelo le llama inmediatamente, pero Carmen no tiene ganas de hablar en ese momento, y preferiría que simplemente le hubiera respondido al mensaje. Se siente un poco triste por no responder a la llamada.",
  vota:"Una buena noticia, ¿cómo prefieres contarla?",
  ops:["Por mensaje","Por llamada","En persona","Depende de a quién"],
  pregs:["¿Sueles mirar si la gente ha visto tus mensajes o está en línea? ¿Por qué?", "¿Cómo te gusta compartir noticias importantes? ¿Prefieres mensajes, llamadas o hacerlo en persona?", "Si estuvieras en la situación de Carmen, ¿cómo reaccionarías?"]}
]},
{id:"int",juego:"Juego 02",nombre:"Intimidad",color:"#803594",tinta:"#FFFFFF",cartas:[
 {n:"15 y 16",img:"img/q15.png",titulo:"Las notas de Carmen",quien:["Carmen","Olga","Teresa"],
  sit:"Carmen acaba de saber que ha aprobado los exámenes con excelentes. Se siente muy orgullosa, y cuelga una foto para celebrarlo en Instagram con el mensaje “¡Por fin lo he conseguido!”.\nSu abuela, Olga, que no está en las redes sociales, se entera de la noticia por un vecino que ha visto la publicación de Carmen. Más tarde, por la noche, Olga le pregunta: “¿Por qué no me lo has dicho a mí primero?” Carmen se siente un poco culpable, pero se defiende diciendo: “¡Quería compartirlo rápidamente! Todo el mundo cuelga cosas en internet”.\nLa madre de Carmen, Teresa, intenta calmarlas, pero no ve claro quién tiene razón.",
  vota:"¿Quién tiene más razón?",
  ops:["Olga","Carmen","Las dos","Ninguna: fue un malentendido"],
  pregs:["¿Cómo prefieres enterarte de noticias importantes de otros miembros de la familia?", "¿Cómo prefieres compartir tus propias noticias?", "¿Qué noticias crees que es mejor compartir en privado antes de publicarlas?", "¿Qué podríamos hacer para que todo el mundo se sintiera más incluido y tenido en cuenta en una situación similar?"]},
 {n:"17 y 18",img:"img/q17.png",titulo:"La cena interrumpida",quien:["Juan","Antonio","Luis","Teresa"],
  sit:"En la cena de la familia Fernández, todo el mundo charla en la mesa. Juan y su abuelo, Antonio, ríen mientras juegan con el asistente virtual (p. ej., Alexa) a un juego de preguntas y respuestas. El padre, Luis, está a su lado e intenta explicar a todo el mundo una historia divertida del trabajo. Mientras tanto, la madre, Teresa, mira repetidamente el móvil porque no le paran de llegar mensajes del trabajo. Intenta estar al caso, pero los demás siguen la conversación sin ella.\nLuis se detiene a media historia porque ve que los demás no le hacen caso. Teresa está agobiada, intentando prestar atención a la familia, pero al mismo tiempo respondiendo a los mensajes de trabajo. Juan y su abuelo Antonio paran el juego, un poco decepcionados.",
  vota:"En nuestras comidas, la tecnología debería estar…",
  ops:["Fuera de la mesa","Solo para urgencias","Permitida si la usamos juntos","Sin reglas"],
  pregs:["¿Qué hace que te sientas incluido/a durante el tiempo que compartes con la familia (las comidas, conversaciones familiares...)?", "¿Te parece que hay mensajes que requieren una respuesta inmediata?", "¿Qué tipos de interrupciones debidas a las tecnologías (mensajes, llamadas, mirar las redes...) te parecen bien, y cuáles no?", "¿Te gustaría que la familia pusiera normas de comportamiento con la tecnología en las comidas? ¿Por qué? ¿Cuáles podrían ser?"]},
 {n:"19 y 20",img:"img/s19.png",titulo:"La reunión por videollamada",quien:["Juan","Antonio","Luis"],
  sit:"Juan va a la reunión de familias y profesorado con el abuelo, Antonio, mientras que su padre, Luis participa por videollamada desde el trabajo. La conexión se corta constantemente, y Luis se pierde partes de la conversación.\nJuan está contento de que su padre haya hecho el esfuerzo de conectarse y estar allí, pero al mismo tiempo le gustaría que estuviese presencialmente en la reunión, como hacen otras familias.",
  vota:"Participar por videollamada en un momento importante es…",
  ops:["Estar presente","Mejor que nada","No es lo mismo","Depende del momento"],

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mus.g);o.start(t);o.stop(t+d+.03)}
function compas(){
  if(!ctx||!mus.pista||ctx.state!=="running")return;
  const P=PISTAS[mus.pista],c=30/P.bpm;
  if(mus.t<ctx.currentTime)mus.t=ctx.currentTime+.05;
  while(mus.t<ctx.currentTime+.35){
    const s=mus.paso%64,e=s%8,ch=P.ac[Math.floor(s/8)%4],pat=s<32?P.pat:P.pat.slice().reverse(),i=pat[e];
    if(e===0)ch.forEach(n=>nota(HZ(n),mus.t,c*8,"sine",.02));
    if(e===0||e===4)nota(HZ(ch[0]-12),mus.t,c*3,"triangle",.06);
    if(i>=0)nota(HZ([ch[0],ch[1],ch[2],ch[0]+12][i]+12),mus.t,c*1.6,P.onda,P.onda==="square"?.022:.05);
    mus.paso++;mus.t+=c}
}
function musica(){
  const quiero=A.musica&&gesto?(S.orden.length&&S.pantalla!=="inicio"?area().id:"inicio"):null;
  try{
    if(!quiero){if(mus.g)mus.g.gain.setTargetAtTime(0,ctx.currentTime,.05);mus.pista=null;clearInterval(mus.reloj);mus.reloj=null;return}
    if(!audio())return;
    if(!mus.g){mus.g=ctx.createGain();mus.g.gain.value=0;mus.g.connect(ctx.destination)}
    let espera=0;
    if(mus.pista!==quiero){mus.pista=quiero;mus.paso=0;mus.t=ctx.currentTime+.3;mus.g.gain.setTargetAtTime(0,ctx.currentTime,.04);espera=.25}
    const nivel=hablando?0:(S.pantalla==="pregunta"||S.pantalla==="acuerdo"?.45:1);
    mus.g.gain.setTargetAtTime(nivel,ctx.currentTime+espera,.08);
    if(!mus.reloj)mus.reloj=setInterval(compas,100);
  }catch(e){}
}
function botonMusica(){return '<button class="mini" data-a="musica" aria-pressed="'+A.musica+'" aria-label="Música de fondo">Música: '+(A.musica?"sí":"no")+'</button>'}

function habla(t,b){
  if(hablando){calla();musica();b.textContent="Escuchar";return}
  try{const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=.92;u.onend=u.onerror=()=>{hablando=false;musica();if(b.isConnected)b.textContent="Escuchar"};

}

    if(++n<260)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();

function nueva(modo,k){

    orden=todas.slice(0,3)}
  else orden=AREAS[k].cartas.map((_,y)=>[k,y]);
  S={pantalla:"jugadores",jug:S.jug,modo:modo,orden:orden,i:0,votos:[],q:0,empieza:"",prem:{},pts:0,acuerdos:[],medallas:[],reg:[],tipoAc:"no"};
  ir("jugadores");
}
function cierraVoto(){
  const v=validos();
  if(!v.length){premio("c"+S.i+"v",0);S.q=0;S.empieza="";ir("pregunta");return}
  const distinto=new Set(v).size>1;if(distinto)medalla("Opiniones distintas");
  premio("c"+S.i+"v",50*v.length+(distinto?200:100),"Votación terminada.");ir("resultado");setTimeout(()=>suena("resultado"),260);
}
function anota(){ /* registro de la carta recién jugada, sin nombres de personas */
  const c=carta(),v=validos();let hab=0;
  c.pregs.forEach((_,q)=>{if(S.prem["c"+S.i+"q"+q])hab++});
  S.reg.push({n:c.n,titulo:c.titulo,area:area().nombre,vota:c.vota,votos:c.ops.map((o,k)=>[o,v.filter(x=>x===k).length]),sin:S.votos.length?S.votos.length-v.length:S.jug.length,hab:hab,de:c.pregs.length,ac:S.tipoAc});
}
function resumen(){
  const f=new Date(),L=["Hablemos: resumen de la partida","Fecha: "+f.getDate()+"/"+(f.getMonth()+1)+"/"+f.getFullYear(),
    "Área: "+(S.modo==="mix"?"Sorpresa (cartas de varias áreas)":AREAS[S.orden[0][0]].nombre),"Personas que jugaron: "+S.jug.length,""];
  S.reg.forEach(r=>{L.push("Cartas "+r.n+" ("+r.area+"): "+r.titulo);
    L.push("  Votación “"+r.vota+"”: "+(r.sin===S.jug.length?"no se votó":r.votos.map(x=>x[0]+" "+x[1]).join("; ")+(r.sin?"; sin votar "+r.sin:"")));
    L.push("  Preguntas conversadas: "+r.hab+" de "+r.de);
    L.push("  Acuerdo: "+({escrito:"sí, escrito",palabra:"sí, de palabra",no:"no"})[r.ac]);});
  L.push("");if(S.acuerdos.length){L.push("Acuerdos escritos:");S.acuerdos.forEach(a=>L.push("  • "+a))}
  L.push("Puntos de la familia: "+S.pts);
  return L.join("\n");
}
function tras(){ /* después del acuerdo: siguiente carta o cierre */
  anota();S.tipoAc="no";
  if(S.i<S.orden.length-1){S.i++;S.votos=[];S.q=0;S.empieza="";ir("situacion");return}
  if(S.modo==="area"){suma_a(K_AR,area().id);medalla("Área completa");if(lee(K_AR).length===AREAS.length)medalla("Mazo completo")}
  if(S.pts>=1500)medalla("Mesa conversadora");
  ir("final");
}
function atras(){
  const p=S.pantalla;
  if(p==="situacion")ir("jugadores");
  else if(p==="pase"){if(S.votos.length){S.votos.pop();ir("pase")}else ir("situacion")}
  else if(p==="voto")ir("pase");
  else if(p==="resultado"){S.votos=[];premio("c"+S.i+"v",0);ir("pase")}
  else if(p==="pregunta"){if(S.q>0){S.q--;S.empieza="";ir("pregunta")}else ir(validos().length?"resultado":"situacion")}
  else if(p==="acuerdo"){S.q=carta().pregs.length-1;S.empieza="";ir("pregunta")}
}
function textoParaOir(){
  const c=carta();
  if(S.pantalla==="situacion")return c.titulo+". "+c.sit;
  if(S.pantalla==="voto")return c.vota+" Opciones: "+c.ops.join(". ")+".";
  return c.pregs[S.q];
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==="vota")suena("voto"+b.dataset.k);else if(SON_DE[a])suena(SON_DE[a]);
  if(a==="area")nueva("area",+b.dataset.k);
  else if(a==="sorpresa")nueva("mix");
  else if(a==="ayuda")abre("ayuda");
  else if(a==="musica"){A.musica=!A.musica;ajusta();pinta();const m=app.querySelector('[data-a="musica"]');if(m)m.focus()}
  else if(a==="cierra")cierra();
  else if(a==="aj"){A[b.dataset.k]=b.dataset.k==="letra"?+b.dataset.v:b.dataset.v==="1";ajusta();if(b.dataset.k==="sonido")suena("punto");
    capa.querySelectorAll('[data-k="'+b.dataset.k+'"]').forEach(x=>x.setAttribute("aria-pressed",String(x===b)));if(!velo)return;pinta()}
  else if(a==="inicio"){if(S.pantalla==="final"||S.pantalla==="jugadores"){S.orden=[];S.i=0;ir("inicio")}else abre("salir")}
  else if(a==="otra"){if(velo)cierra();S.orden=[];S.i=0;ir("inicio")}
  else if(a==="atras")atras();
  else if(a==="escucha")habla(textoParaOir(),b);
  else if(a==="pon")agrega(b.dataset.n);
  else if(a==="quita"){const n=S.jug.splice(+b.dataset.k,1)[0];voz.textContent="Se quitó a "+n+".";pinta(true)}
  else if(a==="partir")ir("situacion");
  else if(a==="avotar"){S.votos=[];ir("pase")}
  else if(a==="saltavoto"){S.votos=[];premio("c"+S.i+"v",0);S.q=0;S.empieza="";ir("pregunta")}
  else if(a==="veo")ir("voto");
  else if(a==="vota"||a==="novota"){S.votos.push(a==="vota"?+b.dataset.k:-1);if(S.votos.length<S.jug.length)ir("pase");else cierraVoto()}
  else if(a==="apregs"){S.q=0;S.empieza="";ir("pregunta")}
  else if(a==="otrapersona"){const el=document.getElementById("ruleta");el.dataset.antes=S.empieza;S.empieza="";gira()}
  else if(a==="hablado"||a==="salta"){premio("c"+S.i+"q"+S.q,a==="hablado"?100:0,"Suman 100 puntos.");
    if(S.q<carta().pregs.length-1){S.q++;S.empieza="";ir("pregunta")}else ir("acuerdo")}
  else if(a==="acuerda"){const t=document.getElementById("txt-acuerdo"),v=t.value.trim();
    if(!v){suena("aviso");document.getElementById("aviso-acuerdo").textContent="Escriban el acuerdo en el recuadro, o elijan “Lo acordamos de palabra”.";t.focus();return}
    suena("acuerdo");S.tipoAc="escrito";S.acuerdos.push(v);suma_a(K_AC,v);premio("c"+S.i+"a",300,"Acuerdo guardado.");medalla("Familia con acuerdo");tras()}
  else if(a==="depalabra"){S.tipoAc="palabra";premio("c"+S.i+"a",300,"Acuerdo de palabra.");medalla("Familia con acuerdo");tras()}
  else if(a==="sinacuerdo"){S.tipoAc="no";premio("c"+S.i+"a",0);tras()}
  else if(a==="copia"){const t=resumen();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="Resumen copiado"}).catch(()=>{b.textContent="No se pudo copiar. Mantengan el dedo sobre el texto para seleccionarlo."})}
});
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(!gesto){gesto=true;musica()}},true));
document.addEventListener("visibilitychange",()=>{if(!ctx)return;try{if(document.hidden)ctx.suspend();else{ctx.resume();musica()}}catch(e){}});
document.addEventListener("keydown",e=>{
  if(!velo)return;
  if(e.key==="Escape"){cierra();return}
  if(e.key==="Tab"){const f=[...capa.querySelectorAll("button")];if(!f.length)return;const pr=f[0],ul=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===pr||!capa.contains(document.activeElement))){e.preventDefault();ul.focus()}
    else if(!e.shiftKey&&document.activeElement===ul){e.preventDefault();pr.focus()}}
});
/* ---------- Arranque (conserva la partida si la página se actualiza) ---------- */
function arranca(d){
  if(d&&d.pantalla&&V[d.pantalla]&&d.prem&&Array.isArray(d.reg)&&Array.isArray(d.orden)&&(d.pantalla==="inicio"||(d.orden.length&&Array.isArray(d.orden[0]))))S=d;
  ajusta();pinta();
}
if(window.claude&&window.claude.hot){window.claude.hot.snapshot(()=>S);
  window.claude.hot.ready?window.claude.hot.ready(arranca):arranca(window.claude.hot.data||{})}
else arranca({});
/* Guarda la app en el teléfono para que abra sin conexión. */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
